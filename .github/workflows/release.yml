name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build React PRO frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: python scripts/package_portable.py
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = python -c "from core.branding import APP_VERSION; print(APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" scripts\installer\orcfin.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OrcFin-windows-release
          path: |
            dist/OrcFin-portable.zip
            dist/OrcFin-Setup.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: OrcFin-windows-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" -y 2>/dev/null || true
          gh release create "$TAG" \
            --title "OrcFin $TAG" \
            --notes-file .github/release-body.md \
            --latest \
            dist/OrcFin-portable.zip \
            dist/OrcFin-Setup.exe
